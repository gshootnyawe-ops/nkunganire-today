<!doctype html>
<html lang="rw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087443"><title>Fungura konti | Nkunganire Today</title><link rel="stylesheet" href="style.css"></head>
<body class="account-page"><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">N</span><span>Nkunganire <b>Today</b></span></a><a class="btn btn-quiet" href="index.html">← Ahabanza</a></header><main class="account-wrap"><section class="account-card"><span class="eyebrow">TANGIRA NONAHA</span><h1>Fungura konti</h1><p class="account-intro">Uzuza amakuru akenewe kugira ngo utangire.</p><form id="register-form"><label for="fullname">Amazina yawe</label><input id="fullname" name="fullname" autocomplete="name" required placeholder="Amazina yuzuye"><label for="phone">Nimero ya telefone</label><input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" required placeholder="078... cyangwa +25078..."><label for="reg-password">Ijambo ry'ibanga</label><input id="reg-password" name="password" type="password" autocomplete="new-password" minlength="8" required placeholder="Nibura inyuguti 8"><button class="btn btn-primary btn-large form-submit" id="register-submit" type="submit">Kora konti</button><p class="form-message" id="form-message" role="status" aria-live="polite"></p></form><p class="account-switch">Usanzwe ufite konti? <a href="login.html">Injira</a></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const form=document.getElementById('register-form'),msg=document.getElementById('form-message'),btn=document.getElementById('register-submit');
function normalizeRwPhone(value){let p=value.replace(/[\\s()-]/g,'');if(/^07\\d{8}$/.test(p))p='+250'+p.slice(1);else if(/^2507\\d{8}$/.test(p))p='+'+p;return p;}
form.addEventListener('submit',async e=>{e.preventDefault();const phone=normalizeRwPhone(form.phone.value.trim());if(!/^\\+2507\\d{8}$/.test(phone)){msg.textContent='Andika nimero y’u Rwanda neza, urugero 0781234567 cyangwa +250781234567.';return;}msg.textContent='Turimo gukora konti yawe...';btn.disabled=true;try{const {data,error}=await window.sbClient.auth.signUp({phone,password:form.password.value,options:{data:{full_name:form.fullname.value.trim(),phone}}});if(error)throw error;msg.textContent=data.session?'Konti yawe yakozwe neza! Ushobora kwinjira.':'Konti yasabwe neza. Reba igenamiterere rya Phone Confirmation muri Supabase.';form.reset();}catch(err){msg.textContent=err.message||'Kwiyandikisha byanze. Ongera ugerageze.';}finally{btn.disabled=false;}});
</script></body></html>
