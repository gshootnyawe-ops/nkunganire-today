<!doctype html>
<html lang="rw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087443"><title>Injira | Nkunganire Today</title><link rel="stylesheet" href="style.css"></head>
<body class="account-page"><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">N</span><span>Nkunganire <b>Today</b></span></a><a class="btn btn-quiet" href="index.html">← Ahabanza</a></header><main class="account-wrap"><section class="account-card"><span class="eyebrow">MURAKAZA NEZA</span><h1>Injira muri konti</h1><p class="account-intro">Koresha email n'ijambo ry'ibanga byawe.</p><form id="login-form"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required placeholder="Andika email yawe"><label for="password">Ijambo ry'ibanga</label><input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Andika ijambo ry'ibanga"><button class="btn btn-primary btn-large form-submit" id="login-submit" type="submit">Injira</button><p class="form-message" id="form-message" role="status" aria-live="polite"></p></form><p class="account-switch">Nta konti ufite? <a href="register.html">Fungura konti</a></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const form=document.getElementById('login-form'),msg=document.getElementById('form-message'),btn=document.getElementById('login-submit');
form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Turimo kugenzura amakuru yawe...';btn.disabled=true;try{const {data,error}=await window.sbClient.auth.signInWithPassword({email:form.email.value.trim(),password:form.password.value});if(error)throw error;msg.textContent='Winjiye neza! Konti yawe irakora. Dashboard turacyayitegura.';}catch(err){msg.textContent=err.message||'Kwinjira byanze. Ongera ugerageze.';}finally{btn.disabled=false;}});
</script></body></html>
